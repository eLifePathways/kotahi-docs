# Copy to the repository root as netlify.toml

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://docs.elifepathways.org"

# Deploy previews get their own URL, so let Netlify supply it.
[context.deploy-preview.build.environment]
  SITE_URL = "$DEPLOY_PRIME_URL"

[context.branch-deploy.build.environment]
  SITE_URL = "$DEPLOY_PRIME_URL"

# Long cache for hashed build assets; they never change in place.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
