# Copy to .github/workflows/deploy.yml
#
# Deploys the built site to an eLife-owned S3 bucket behind CloudFront.
#
# Use this only if the site must live on eLife infrastructure. For a static
# site this is the right shape — S3 + CloudFront is static hosting, and needs
# no container image, no pod and no Flux reconciliation. Do NOT put this site
# into the Kubernetes cluster via `builder`; see elife-infrastructure-notes.md.
#
# Authentication uses GitHub's OIDC provider, so there are no long-lived AWS
# access keys in the repository. The infrastructure team creates an IAM role
# that trusts this repository and nothing else.
#
# Required repository variables (Settings -> Secrets and variables -> Actions):
#   AWS_ROLE_ARN        arn:aws:iam::<account>:role/<role-name>
#   AWS_REGION          e.g. us-east-1
#   S3_BUCKET           the private bucket fronted by CloudFront
#   CLOUDFRONT_DIST_ID  the distribution to invalidate
#   SITE_URL            e.g. https://docs.elifepathways.org

name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets first, with a long cache. They are immutable, so a stale
      # copy is never wrong and browsers should keep them.
      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "*" \
            --include "_astro/*" \
            --include "fonts/*" \
            --cache-control "public,max-age=31536000,immutable"

      # Then everything else, which must revalidate so content fixes appear.
      - name: Upload HTML and the rest
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "_astro/*" \
            --exclude "fonts/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"

# Note on URLs: Starlight builds directory-style paths such as
# /using-kotahi/dashboard/. S3 static hosting resolves those to
# .../index.html only via the *website endpoint*, which cannot be private.
# With a private bucket + Origin Access Control (the recommended setup), add a
# CloudFront Function or CloudFront Functions viewer-request handler that
# appends "index.html" to any URI ending in "/". The infrastructure team will
# recognise this as the standard SPA/static-site rewrite; mention it when you
# ask, because it is the one thing that is easy to miss and breaks every page
# except the home page.
