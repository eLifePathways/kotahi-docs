# Serving the built site from an eLife-managed web server.
#
# The build output is entirely static: copy dist/ to the document root and
# serve it. No Node runtime is needed in production.

server {
    listen 443 ssl http2;
    server_name docs.elifepathways.org;

    root /var/www/kotahi-docs;
    index index.html;

    # Starlight builds directory-style URLs (/using-kotahi/dashboard/).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed assets are immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML should revalidate so content fixes appear promptly.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
